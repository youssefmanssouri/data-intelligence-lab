name: Release build on Windows

# Builds the release installer from the selected ref (normally main) exactly as the
# verified pipeline does, re-runs the installer lifecycle test on the built file,
# and records its SHA-256, size and commit. It never publishes a release: with
# create_draft it creates a DRAFT GitHub release (visible only to repository
# maintainers); making it public is a separate, explicitly approved owner action.
#
# Refuses to build when there is no LICENSE at the repository root, when the
# requested version differs from backend/version.py, or when the tag already exists.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version; must equal backend/version.py (for example 1.1.0)"
        required: true
        type: string
      create_draft:
        description: "Create a DRAFT GitHub release with the installer and SHA256SUMS (never published)"
        required: false
        default: false
        type: boolean
      reuse_run_id:
        description: "With create_draft: skip the build and draft the files of this earlier release run (the exact installer whose hash was recorded)"
        required: false
        default: ""
        type: string
      publish_draft:
        description: "Only publish the existing DRAFT v<version> (owner-approved): re-checks the installer's SHA-256 against CHANGELOG.md, builds nothing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  PYARROW_RELEASE_TAG: build-input/pyarrow-26.0.1-crt-free-cp314-45981135518
  PYARROW_WHEEL: pyarrow-26.0.1-cp314-cp314-win_amd64.whl
  PYARROW_WHEEL_SHA256: c2ebaacbf888bafdba0eb052266fcf9107b5f62f7f4e6e488c1a7f4756847703
  NODE_ZIP: node-v22.23.5-win-x64.zip
  # From https://nodejs.org/dist/v22.23.5/SHASUMS256.txt
  NODE_ZIP_SHA256: 4a191082e9706866830379d577d2cc8a50c776fcd9436a8d061b063ed0d9a0e3
  NEXT_TELEMETRY_DISABLED: "1"
  # The published release that the new installer must upgrade in place (upgrade test).
  UPGRADE_FROM_TAG: v1.0.0
  UPGRADE_FROM_VERSION: 1.0.0
  UPGRADE_FROM_SETUP: DataIntelligenceLab-Setup-1.0.0.exe
  UPGRADE_FROM_SHA256: 4d1b26af4cc61532a2b008c4dcd9b381f8d0c3aa6e4b05291cd85e68208e1e35
  # SETUP_NAME and RELEASE_TAG are set by the preflight step from the requested version.


jobs:
  build:
    name: Build and re-test the release installer
    if: ${{ inputs.reuse_run_id == '' && !inputs.publish_draft }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.14.10 x64 (build tool only)
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.14.10"
          architecture: "x64"

      - name: Release preflight (license, version, tag)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path LICENSE -PathType Leaf)) { throw "No LICENSE file at the repository root: choose and commit a license before building a release." }
          $appVersion = (python -I -c "import sys; sys.path.insert(0, 'backend'); import version; print(version.APP_VERSION)").Trim()
          if ($appVersion -ne $env:INPUT_VERSION) { throw "Requested version $($env:INPUT_VERSION) differs from backend/version.py ($appVersion)" }
          $tag = "v$($env:INPUT_VERSION)"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; refusing to build over it." }
          $global:LASTEXITCODE = 0
          "Releasing $tag from $env:GITHUB_SHA ($env:GITHUB_REF_NAME)"
          "SETUP_NAME=DataIntelligenceLab-Setup-$($env:INPUT_VERSION).exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Node.js 22.23.5 (build tool only, hash-pinned)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP $env:NODE_ZIP
          Invoke-WebRequest "https://nodejs.org/dist/v22.23.5/$env:NODE_ZIP" -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:NODE_ZIP_SHA256) { throw "Node.js zip SHA-256 mismatch: $actual" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\nodejs"
          $dir = "$env:RUNNER_TEMP\nodejs\node-v22.23.5-win-x64"
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$dir\node.exe" --version
          & "$dir\npm.cmd" --version

      - name: Record the VC++ Redistributable on the runner (documented prerequisite >= 14.44)
        shell: pwsh
        run: |
          $key = "HKLM:\SOFTWARE\Microsoft\VisualStudio\14.0\VC\Runtimes\x64"
          if (Test-Path $key) { Get-ItemProperty $key | Select-Object Version, Installed, Major, Minor, Bld | Format-List }
          else { Write-Warning "VC++ 2015-2022 x64 runtime registry key not found" }

      - name: Download the CRT-free PyArrow wheel from the build-input pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          gh release download $env:PYARROW_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern $env:PYARROW_WHEEL --dir "$env:RUNNER_TEMP\pyarrow"
          if ($LASTEXITCODE -ne 0) { throw "gh release download failed ($LASTEXITCODE)" }
          $h = (Get-FileHash "$env:RUNNER_TEMP\pyarrow\$env:PYARROW_WHEEL" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($h -ne $env:PYARROW_WHEEL_SHA256) { throw "PyArrow wheel SHA-256 mismatch: $h" }

      - name: Build the verified wheelhouse
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python packaging/prepare_wheelhouse.py --pyarrow-wheel "$env:RUNNER_TEMP\pyarrow\$env:PYARROW_WHEEL" --output-dir "$env:RUNNER_TEMP\wheelhouse"
          if ($LASTEXITCODE -ne 0) { throw "prepare_wheelhouse.py failed ($LASTEXITCODE)" }

      - name: Build the production frontend
        shell: pwsh
        working-directory: frontend
        run: |
          $ErrorActionPreference = "Stop"
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed ($LASTEXITCODE)" }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "npm run build failed ($LASTEXITCODE)" }
          Get-Content .next\BUILD_ID

      - name: Build the release bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python packaging/build_runtime_bundle.py --mode release --wheelhouse "$env:RUNNER_TEMP\wheelhouse" --output-dir "$env:RUNNER_TEMP\bundle" --cache-dir "$env:RUNNER_TEMP\runtime-cache"
          if ($LASTEXITCODE -ne 0) { throw "build_runtime_bundle.py failed ($LASTEXITCODE)" }

      - name: Re-verify the bundle against its manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python packaging/build_runtime_bundle.py --verify "$env:RUNNER_TEMP\bundle"
          if ($LASTEXITCODE -ne 0) { throw "bundle verification failed ($LASTEXITCODE)" }
          $m = Get-Content "$env:RUNNER_TEMP\bundle\manifest.json" -Raw | ConvertFrom-Json
          "files: $($m.file_count)  bytes: $($m.total_bytes)"
          $m.runtime | Select-Object mode, frontend_build_id, python_excluded_files | Format-List
          $m.runtime.crt_gate | Format-List
          $m.runtime.node | Format-List

      - name: Smoke-test the bundle independently
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python packaging/smoke_test_bundle.py --bundle "$env:RUNNER_TEMP\bundle" --work-dir "$env:RUNNER_TEMP\smoke" --evidence "$env:RUNNER_TEMP\smoke-evidence.json"
          if ($LASTEXITCODE -ne 0) { throw "bundle smoke test failed ($LASTEXITCODE)" }

      - name: Locate Inno Setup (6.3+ required; enforced by the compile)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup 6 is not installed on this runner image" }
          # ISCC.exe carries no file version resource (reads 0.0.0.0); record the installed
          # version from Inno Setup's uninstall entry. The compile step is the real 6.3+ gate:
          # older compilers reject ArchitecturesAllowed=x64compatible.
          $keys = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1",
                  "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1"
          $ver = ($keys | Where-Object { Test-Path $_ } | ForEach-Object { (Get-ItemProperty $_).DisplayVersion } | Select-Object -First 1)
          "ISCC: $iscc (Inno Setup $ver)"
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & $env:ISCC /Q "/DBundleDir=$env:RUNNER_TEMP\bundle" "/DOutputDir=$env:RUNNER_TEMP\dist" packaging\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          Get-ChildItem "$env:RUNNER_TEMP\dist" | ForEach-Object { "{0}  {1} bytes  sha256 {2}" -f $_.Name, $_.Length, (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }

      - name: Re-test the built installer (full lifecycle)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\release-out" | Out-Null
          python packaging/test_installer.py --setup "$env:RUNNER_TEMP\dist\$env:SETUP_NAME" --bundle "$env:RUNNER_TEMP\bundle" --work-dir "$env:RUNNER_TEMP\release-lifecycle" --evidence "$env:RUNNER_TEMP\release-out\installer-lifecycle.json"
          if ($LASTEXITCODE -ne 0) { throw "installer lifecycle test failed ($LASTEXITCODE)" }

      - name: Upgrade test from the published ${{ env.UPGRADE_FROM_TAG }} installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $old = "$env:RUNNER_TEMP\upgrade-from"
          New-Item -ItemType Directory -Force -Path $old | Out-Null
          gh release download $env:UPGRADE_FROM_TAG --repo $env:GITHUB_REPOSITORY --pattern $env:UPGRADE_FROM_SETUP --dir $old
          if ($LASTEXITCODE -ne 0) { throw "could not download $env:UPGRADE_FROM_SETUP" }
          $hash = (Get-FileHash (Join-Path $old $env:UPGRADE_FROM_SETUP) -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:UPGRADE_FROM_SHA256) { throw "published installer hash $hash does not match the recorded $env:UPGRADE_FROM_SHA256" }
          python packaging/test_upgrade.py --old-setup (Join-Path $old $env:UPGRADE_FROM_SETUP) --old-version $env:UPGRADE_FROM_VERSION --new-setup "$env:RUNNER_TEMP\dist\$env:SETUP_NAME" --new-version "${{ inputs.version }}" --bundle "$env:RUNNER_TEMP\bundle" --work-dir "$env:RUNNER_TEMP\upgrade-test" --evidence "$env:RUNNER_TEMP\release-out\upgrade-test.json"
          if ($LASTEXITCODE -ne 0) { throw "upgrade test failed ($LASTEXITCODE)" }

      - name: Record release hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "$env:RUNNER_TEMP\release-out"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "$env:RUNNER_TEMP\dist\$env:SETUP_NAME" $out
          Copy-Item "$env:RUNNER_TEMP\bundle\manifest.json" (Join-Path $out "bundle-manifest.json")
          $files = Get-ChildItem $out -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | Sort-Object Name
          $lines = $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name }
          [IO.File]::WriteAllLines((Join-Path $out "SHA256SUMS.txt"), [string[]]$lines)
          $setup = Get-Item (Join-Path $out $env:SETUP_NAME)
          $info = [ordered]@{
            tag = $env:RELEASE_TAG; commit = $env:GITHUB_SHA; ref = $env:GITHUB_REF_NAME; run_id = $env:GITHUB_RUN_ID
            installer = $setup.Name; size = $setup.Length; sha256 = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $info | ConvertTo-Json | Set-Content (Join-Path $out "release-info.json") -Encoding utf8
          Get-Content (Join-Path $out "SHA256SUMS.txt")
          "RELEASE_INSTALLER: $($info.installer)  size $($info.size)  sha256 $($info.sha256)  commit $($info.commit)"

      - name: Upload the release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dil-release-${{ inputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}\release-out
          retention-days: 30
          if-no-files-found: error

  draft:
    name: Create a DRAFT release (not published)
    needs: build
    if: ${{ always() && inputs.create_draft && !inputs.publish_draft && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.reuse_run_id != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the draft release
      actions: read # download the artifact of an earlier release run
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download the release files (this run)
        if: ${{ inputs.reuse_run_id == '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dil-release-${{ inputs.version }}-${{ github.sha }}
          path: release-out

      - name: Download the release files (earlier run ${{ inputs.reuse_run_id }})
        if: ${{ inputs.reuse_run_id != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dil-release-${{ inputs.version }}-*
          merge-multiple: true
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ github.token }}
          path: release-out

      - name: Verify and create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cd release-out
          tr -d '\r' < SHA256SUMS.txt | sed '1s/^\xEF\xBB\xBF//' | sha256sum -c -
          built_from=$(python3 -c "import json,sys; d=json.load(open('release-info.json', encoding='utf-8-sig')); print(d['commit']); assert d['tag']=='v'+sys.argv[1], d" "$VERSION")
          installer_sha=$(python3 -c "import json; print(json.load(open('release-info.json', encoding='utf-8-sig'))['sha256'])")
          cd ..
          # The notes must name exactly this installer.
          grep -q "$installer_sha" CHANGELOG.md || { echo "::error::CHANGELOG.md does not record installer SHA-256 $installer_sha"; exit 1; }
          tag="v${VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists"; exit 1
          fi
          # Release notes: the CHANGELOG section for this version.
          awk -v v="$VERSION" '$0 ~ "^## "v" " {f=1; next} f && /^## / {exit} f {print}' CHANGELOG.md > notes.md
          printf '\n---\nInstaller built from %s; SHA-256 of every file is in SHA256SUMS.txt.\n' "$built_from" >> notes.md
          gh release create "$tag" release-out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --draft --title "Data Intelligence Lab ${VERSION}" --notes-file notes.md
          echo "Draft release $tag created; it is NOT published."

  publish:
    name: Publish the approved draft
    if: ${{ inputs.publish_draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # publish the draft release
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify the draft's files, then publish it
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          is_draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          [ "$is_draft" = "true" ] || { echo "::error::$tag is not a draft; nothing to publish"; exit 1; }
          mkdir check && cd check
          gh release download "$tag" --repo "$GITHUB_REPOSITORY"
          tr -d '\r' < SHA256SUMS.txt | sed '1s/^\xEF\xBB\xBF//' | sha256sum -c -
          setup="DataIntelligenceLab-Setup-${VERSION}.exe"
          actual=$(sha256sum "$setup" | cut -c1-64)
          grep -q "$actual" ../CHANGELOG.md || { echo "::error::CHANGELOG.md does not record $setup SHA-256 $actual"; exit 1; }
          echo "$setup sha256 $actual matches CHANGELOG.md"
          cd ..
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,url,publishedAt
