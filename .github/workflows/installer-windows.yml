name: Installer build and lifecycle test on Windows (Milestone C)

# Builds the release bundle exactly as runtime-bundle-windows.yml does, compiles the
# Inno Setup installer, and drives it silently as a per-user install:
# fresh install -> in-place smoke test -> refusal while running -> reinstall with
# obsolete-file cleanup -> uninstall preserving user storage -> VC++ prerequisite
# gate (test build with VCMinMinor=99). See packaging/test_installer.py.

on:
  # Manual run from main (Actions tab > Run workflow), e.g. to build a release-candidate
  # kit from exactly the merged code. Offered only for workflows on the default branch.
  workflow_dispatch:
  push:
    branches:
      - phase/1f3-11-installer
      - phase/1f3-17-cp314-bundle

permissions:
  contents: read # checkout and download the build-input pre-release

env:
  PYARROW_RELEASE_TAG: build-input/pyarrow-26.0.1-crt-free-cp314-45981135518
  PYARROW_WHEEL: pyarrow-26.0.1-cp314-cp314-win_amd64.whl
  PYARROW_WHEEL_SHA256: c2ebaacbf888bafdba0eb052266fcf9107b5f62f7f4e6e488c1a7f4756847703
  NODE_ZIP: node-v22.23.5-win-x64.zip
  # From https://nodejs.org/dist/v22.23.5/SHASUMS256.txt
  NODE_ZIP_SHA256: 4a191082e9706866830379d577d2cc8a50c776fcd9436a8d061b063ed0d9a0e3
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  installer:
    name: Build, install, upgrade and uninstall (win-x64)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.14.10 x64 (build tool only)
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.14.10"
          architecture: "x64"

      - name: Set up Node.js 22.23.5 (build tool only, hash-pinned)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP $env:NODE_ZIP
          Invoke-WebRequest "https://nodejs.org/dist/v22.23.5/$env:NODE_ZIP" -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:NODE_ZIP_SHA256) { throw "Node.js zip SHA-256 mismatch: $actual" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\nodejs"
          $dir = "$env:RUNNER_TEMP\nodejs\node-v22.23.5-win-x64"
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$dir\node.exe" --version
          & "$dir\npm.cmd" --version

      - name: Record the VC++ Redistributable on the runner (documented prerequisite >= 14.44)
        shell: pwsh
        run: |
          $key = "HKLM:\SOFTWARE\Microsoft\VisualStudio\14.0\VC\Runtimes\x64"
          if (Test-Path $key) { Get-ItemProperty $key | Select-Object Version, Installed, Major, Minor, Bld | Format-List }
          else { Write-Warning "VC++ 2015-2022 x64 runtime registry key not found" }

      - name: Download the CRT-free PyArrow wheel from the build-input pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          gh release download $env:PYARROW_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern $env:PYARROW_WHEEL --dir "$env:RUNNER_TEMP\pyarrow"
          if ($LASTEXITCODE -ne 0) { throw "gh release download failed ($LASTEXITCODE)" }
          $h = (Get-FileHash "$env:RUNNER_TEMP\pyarrow\$env:PYARROW_WHEEL" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($h -ne $env:PYARROW_WHEEL_SHA256) { throw "PyArrow wheel SHA-256 mismatch: $h" }

      - name: Build the verified wheelhouse
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python packaging/prepare_wheelhouse.py --pyarrow-wheel "$env:RUNNER_TEMP\pyarrow\$env:PYARROW_WHEEL" --output-dir "$env:RUNNER_TEMP\wheelhouse"
          if ($LASTEXITCODE -ne 0) { throw "prepare_wheelhouse.py failed ($LASTEXITCODE)" }

      - name: Build the production frontend
        shell: pwsh
        working-directory: frontend
        run: |
          $ErrorActionPreference = "Stop"
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed ($LASTEXITCODE)" }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "npm run build failed ($LASTEXITCODE)" }
          Get-Content .next\BUILD_ID

      - name: Build the release bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python packaging/build_runtime_bundle.py --mode release --wheelhouse "$env:RUNNER_TEMP\wheelhouse" --output-dir "$env:RUNNER_TEMP\bundle" --cache-dir "$env:RUNNER_TEMP\runtime-cache"
          if ($LASTEXITCODE -ne 0) { throw "build_runtime_bundle.py failed ($LASTEXITCODE)" }

      - name: Re-verify the bundle against its manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python packaging/build_runtime_bundle.py --verify "$env:RUNNER_TEMP\bundle"
          if ($LASTEXITCODE -ne 0) { throw "bundle verification failed ($LASTEXITCODE)" }
          $m = Get-Content "$env:RUNNER_TEMP\bundle\manifest.json" -Raw | ConvertFrom-Json
          "files: $($m.file_count)  bytes: $($m.total_bytes)"
          $m.runtime | Select-Object mode, frontend_build_id, python_excluded_files | Format-List
          $m.runtime.crt_gate | Format-List
          $m.runtime.node | Format-List

      - name: Smoke-test the bundle independently
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python packaging/smoke_test_bundle.py --bundle "$env:RUNNER_TEMP\bundle" --work-dir "$env:RUNNER_TEMP\smoke" --evidence "$env:RUNNER_TEMP\smoke-evidence.json"
          if ($LASTEXITCODE -ne 0) { throw "bundle smoke test failed ($LASTEXITCODE)" }

      - name: Locate Inno Setup (6.3+ required; enforced by the compile)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup 6 is not installed on this runner image" }
          # ISCC.exe carries no file version resource (reads 0.0.0.0); record the installed
          # version from Inno Setup's uninstall entry. The compile step is the real 6.3+ gate:
          # older compilers reject ArchitecturesAllowed=x64compatible.
          $keys = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1",
                  "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1"
          $ver = ($keys | Where-Object { Test-Path $_ } | ForEach-Object { (Get-ItemProperty $_).DisplayVersion } | Select-Object -First 1)
          "ISCC: $iscc (Inno Setup $ver)"
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & $env:ISCC /Q "/DBundleDir=$env:RUNNER_TEMP\bundle" "/DOutputDir=$env:RUNNER_TEMP\dist" packaging\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          Get-ChildItem "$env:RUNNER_TEMP\dist" | ForEach-Object { "{0}  {1} bytes  sha256 {2}" -f $_.Name, $_.Length, (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }

      - name: Compile the VC++-gate test installer (requires 14.99; never shipped)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & $env:ISCC /Q "/DBundleDir=$env:RUNNER_TEMP\bundle" "/DOutputDir=$env:RUNNER_TEMP\dist-vc-gate" /DVCMinMinor=99 /DCompression=zip packaging\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC (VC gate build) failed ($LASTEXITCODE)" }

      - name: Installer lifecycle test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python packaging/test_installer.py --setup "$env:RUNNER_TEMP\dist\DataIntelligenceLab-Setup-1.0.0.exe" --vc-gate-setup "$env:RUNNER_TEMP\dist-vc-gate\DataIntelligenceLab-Setup-1.0.0.exe" --bundle "$env:RUNNER_TEMP\bundle" --work-dir "$env:RUNNER_TEMP\installer-test" --evidence "$env:RUNNER_TEMP\installer-evidence.json"
          if ($LASTEXITCODE -ne 0) { throw "installer lifecycle test failed ($LASTEXITCODE)" }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-windows-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\bundle\manifest.json
            ${{ runner.temp }}\smoke-evidence.json
            ${{ runner.temp }}\installer-evidence.json
            ${{ runner.temp }}\installer-test\*.log
          retention-days: 7
          if-no-files-found: warn
